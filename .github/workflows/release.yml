name: Release

# Builds a single self-contained executable with PyInstaller and attaches it
# to a GitHub Release. Triggered by pushing a version tag, e.g. `v2.3.0`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DiskTop.exe
          - os: ubuntu-latest
            artifact: DiskTop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compile native core (optional, best-effort)
        shell: bash
        run: |
          # DiskTop works fully without the native core (pure-Python ctypes).
          # These steps are best-effort: a missing compiler never fails the build.
          DTK_SRC="native/dtk.cpp native/version.cpp native/proclist.cpp native/meminfo.cpp native/trim.cpp native/diskstat.cpp native/tmpscan.cpp native/svc.cpp"
          if ! command -v g++ >/dev/null 2>&1; then
            echo "g++ not available - skipping native core (app uses Python fallback)"
            exit 0
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            g++ -std=c++17 -O2 -static -o native/dtk.exe $DTK_SRC -lpsapi -ladvapi32 || echo "dtk build skipped"
          else
            g++ -std=c++17 -O2 -o native/dtk $DTK_SRC || echo "dtk build skipped"
          fi
          # Also build the tiny dufast accelerator when a C compiler exists.
          command -v gcc >/dev/null 2>&1 && gcc -O2 -o native/dufast$([ "${{ runner.os }}" = "Windows" ] && echo .exe || echo "") native/dufast.c || true

      - name: Build single executable
        run: pyinstaller DiskTop.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub Release with the executable
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiskTop.exe
            DiskTop
          generate_release_notes: true
