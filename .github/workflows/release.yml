name: Release

# Builds a single self-contained executable with PyInstaller and attaches it
# to a GitHub Release. Triggered by pushing a version tag, e.g. `v2.3.0`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DiskTop.exe
          - os: ubuntu-latest
            artifact: DiskTop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single executable
        run: pyinstaller DiskTop.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish GitHub Release with the executable
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiskTop.exe
            DiskTop
          generate_release_notes: true
